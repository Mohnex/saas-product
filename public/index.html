<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تسجيل الدخول | مخطط الادخار</title>
    <meta name="theme-color" content="#007AFF">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { apple: { blue: '#007AFF', green: '#34C759', red: '#FF3B30', gray: '#8E8E93', bg: '#F0F4F8' } },
                    fontFamily: { sans: ['Cairo', '-apple-system', 'sans-serif'] }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-font-smoothing: antialiased; }
        input, button { font-size: 16px !important; }
        .card { background: #fff; border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 8px 30px rgba(0,0,0,0.06); border-radius: 24px; }
        .big-btn { min-height: 56px; }
    </style>
</head>
<body class="bg-apple-bg text-neutral-900 min-h-screen flex items-center justify-center p-5">

    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="bg-apple-blue/10 w-16 h-16 rounded-3xl flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-piggy-bank text-3xl text-apple-blue"></i>
            </div>
            <h1 class="text-lg font-black">مخطط الادخار</h1>
            <p class="text-xs text-apple-gray font-semibold">خطّط، ادّخر، وحقّق أهدافك المالية</p>
        </div>

        <div class="card p-6">
            <div class="flex gap-1 bg-neutral-100 p-1 rounded-2xl mb-5">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all">دخول</button>
                <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all">حساب جديد</button>
            </div>

            <form id="auth-form" onsubmit="return handleAuthSubmit(event)" class="space-y-3">
                <div id="displayname-field" class="hidden">
                    <input type="text" id="input-displayname" placeholder="الاسم الكامل" class="w-full p-3.5 bg-neutral-50 border-2 border-neutral-200 rounded-2xl font-bold text-sm focus:outline-none big-btn">
                </div>
                <input type="email" id="input-email" required placeholder="البريد الإلكتروني" autocomplete="email" class="w-full p-3.5 bg-neutral-50 border-2 border-neutral-200 rounded-2xl font-bold text-sm focus:outline-none big-btn">
                <input type="password" id="input-password" required minlength="6" placeholder="كلمة المرور (٦ أحرف فأكثر)" autocomplete="current-password" class="w-full p-3.5 bg-neutral-50 border-2 border-neutral-200 rounded-2xl font-bold text-sm focus:outline-none big-btn">

                <button type="submit" id="submit-btn" class="w-full bg-apple-blue text-white font-black py-4 rounded-2xl text-sm big-btn">
                    <span id="submit-label">دخول</span>
                </button>
            </form>

            <p id="auth-error" class="hidden text-apple-red text-xs font-bold mt-3 text-center"></p>
            <button id="forgot-password-btn" onclick="handleForgotPassword()" class="hidden w-full text-center text-[11px] text-apple-blue font-bold mt-3">نسيت كلمة المرور؟</button>
        </div>

        <p class="text-center text-[10px] text-apple-gray font-semibold mt-4">
            بالمتابعة، أنت توافق على <a href="/terms.html" class="text-apple-blue">الشروط والأحكام</a> و<a href="/privacy.html" class="text-apple-blue">سياسة الخصوصية</a>
        </p>
    </div>

    <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 text-white text-sm font-bold px-6 py-3.5 rounded-2xl shadow-2xl max-w-[90vw] text-center"></div>

    <script type="module">
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAuK1IQ8zRmjsDftK8I7H4JXxJyUtxutUs",
  authDomain: "saaas-financial-app.firebaseapp.com",
  projectId: "saaas-financial-app",
  storageBucket: "saaas-financial-app.firebasestorage.app",
  messagingSenderId: "651398866959",
  appId: "1:651398866959:web:e559136d9fbf0cdc289b7a",
  measurementId: "G-S58X950PX4"
};

        // ⚠️ رابط خادمك المجاني على Render بعد نشره (مثال:
        // https://your-app-name.onrender.com) - بدون شرطة مائلة بالنهاية.
       const BACKEND_BASE_URL = "https://mohsen-financial-server-production.up.railway.app";

        let auth = null;
        let currentMode = 'login';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        function showError(msg) {
            const el = document.getElementById('auth-error');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function clearError() {
            document.getElementById('auth-error').classList.add('hidden');
        }

        window.switchAuthTab = function(mode) {
            currentMode = mode;
            clearError();
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const nameField = document.getElementById('displayname-field');
            const forgotBtn = document.getElementById('forgot-password-btn');
            const submitLabel = document.getElementById('submit-label');

            if (mode === 'login') {
                loginTab.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-white shadow-sm text-apple-blue';
                signupTab.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-neutral-500';
                nameField.classList.add('hidden');
                forgotBtn.classList.remove('hidden');
                submitLabel.innerText = 'دخول';
            } else {
                signupTab.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-white shadow-sm text-apple-blue';
                loginTab.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-neutral-500';
                nameField.classList.remove('hidden');
                forgotBtn.classList.add('hidden');
                submitLabel.innerText = 'إنشاء الحساب والمتابعة للاشتراك';
            }
        };
        window.switchAuthTab('login');

        async function initFirebase() {
            if (!FIREBASE_CONFIG.apiKey) {
                showError('لم تُضبط إعدادات فايربيس بعد في هذا الملف.');
                return;
            }
            const appModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const authModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const app = appModule.initializeApp(FIREBASE_CONFIG);
            auth = authModule.getAuth(app);
            window._authModule = authModule;

            // إن كان مسجّلاً دخوله مسبقاً بهذا المتصفح، تجاوز مباشرة للتطبيق
            authModule.onAuthStateChanged(auth, (user) => {
                if (user) window.location.href = '/app.html';
            });
        }
        initFirebase();

        function friendlyAuthError(code) {
            const map = {
                'auth/email-already-in-use': 'هذا البريد الإلكتروني مسجَّل مسبقاً - جرّب الدخول بدل إنشاء حساب.',
                'auth/invalid-email': 'صيغة البريد الإلكتروني غير صحيحة.',
                'auth/weak-password': 'كلمة المرور ضعيفة جداً (٦ أحرف على الأقل).',
                'auth/user-not-found': 'لا يوجد حساب بهذا البريد الإلكتروني.',
                'auth/wrong-password': 'كلمة المرور غير صحيحة.',
                'auth/invalid-credential': 'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
                'auth/too-many-requests': 'محاولات كثيرة فاشلة - انتظر قليلاً وحاول مجدداً.'
            };
            return map[code] || 'حدث خطأ غير متوقع، حاول مجدداً.';
        }

        window.handleAuthSubmit = async function(event) {
            event.preventDefault();
            clearError();
            if (!auth) { showError('لم يكتمل الاتصال بعد، أعد المحاولة بعد لحظات.'); return false; }

            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value;
            const displayName = document.getElementById('input-displayname').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            const authModule = window._authModule;

            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';

            try {
                if (currentMode === 'signup') {
                    const cred = await authModule.createUserWithEmailAndPassword(auth, email, password);
                    if (displayName) {
                        await authModule.updateProfile(cred.user, { displayName });
                    }
                    // ينشئ سجل العميل والاشتراك التجريبي عبر الخادم الخلفي المجاني (Render)
                    if (!BACKEND_BASE_URL) {
                        showError('لم يُضبط رابط الخادم الخلفي (BACKEND_BASE_URL) بعد في هذا الملف.');
                        return false;
                    }
                    const idToken = await cred.user.getIdToken();
const initResponse = await fetch('https://mohsen-financial-server-production.up.railway.app/api/initialize-customer', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${idToken}`
    },
    body: JSON.stringify({ displayName })
});
if (!initResponse.ok) {
    const errData = await initResponse.json().catch(() => ({}));
    throw new Error(errData.error || 'تعذر إعداد حسابك على الخادم.');
}
showToast('تم إنشاء حسابك بنجاح! 🎉');
window.location.href = '/onboarding.html';
} else {
    await authModule.signInWithEmailAndPassword(auth, email, password);
    window.location.href = '/app.html';
}
} catch (err) {
    console.error(err);
    showError(err.code ? friendlyAuthError(err.code) : err.message);
} finally {
    submitBtn.disabled = false;
    submitBtn.style.opacity = '1';
}
return false;
};

        window.handleForgotPassword = async function() {
            const email = document.getElementById('input-email').value.trim();
            if (!email) { showError('اكتب بريدك الإلكتروني أولاً ثم اضغط الرابط.'); return; }
            if (!auth) return;
            try {
                await window._authModule.sendPasswordResetEmail(auth, email);
                showToast('تم إرسال رابط إعادة تعيين كلمة المرور لبريدك.');
            } catch (err) {
                showError(friendlyAuthError(err.code));
            }
        };
    </script>
</body>
</html>
